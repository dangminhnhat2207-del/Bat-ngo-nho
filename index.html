<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to my project</title>
    <!-- Thêm font chữ mềm mại từ Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        /* Reset CSS cơ bản */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #2c2c2c; /* Nền tối để làm nổi bật popup */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            overflow: hidden;
        }

        /* Phần nền phía sau (Welcome to my project) */
        .background-content {
            text-align: center;
        }

        .background-content h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem;
            color: #ffb3c6;
            margin-bottom: 20px;
        }

        .btn-open {
            background-color: #ff4d6d;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.4);
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .btn-open:hover {
            transform: scale(1.05);
            background-color: #ff2a55;
        }

        /* ---- CSS cho Modal (Popup Tỏ Tình) ---- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 100;
        }

        /* Class để JS gọi ra khi click */
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background-color: #fff;
            width: 90%;
            max-width: 550px;
            border-radius: 15px;
            padding: 25px;
            display: flex;
            align-items: center;
            position: relative;
            transform: translateY(-30px);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            
            /* Viền hồng đứt đoạn giống trong ảnh */
            border: 3px dashed #ffb3c6;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
        }

        .modal-overlay.active .modal-box {
            transform: translateY(0);
        }

        /* Bố cục chia hai bên trái - phải */
        .modal-left {
            flex: 1;
            text-align: center;
            font-size: 4rem; /* Kích thước cho emoji thay thế ảnh */
            line-height: 1.2;
        }

        .modal-right {
            flex: 1.5;
            padding-left: 20px;
            text-align: center;
            color: #333;
        }

        .modal-right h2 {
            font-family: 'Dancing Script', cursive;
            font-size: 2.8rem;
            color: #ff4d6d;
            margin-bottom: 15px;
        }

        .modal-right p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #555;
            font-style: italic;
        }

        /* Các icon trang trí nhỏ xung quanh */
        .decor {
            position: absolute;
            font-size: 1.2rem;
            opacity: 0.8;
        }
        .decor.top-right { top: 15px; right: 15px; }
        .decor.bottom-left { bottom: 15px; left: 15px; }
        .decor.bottom-right { bottom: 15px; right: 15px; }

        /* Responsive cho điện thoại */
        @media (max-width: 600px) {
            .modal-box {
                flex-direction: column;
                text-align: center;
            }
            .modal-right {
                padding-left: 0;
                margin-top: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- Màn hình chính -->
    <div class="background-content">
        <h1>Welcome to my project</h1>
        <button class="btn-open" id="openBtn">❤️ Bấm vào đây nè ❤️</button>
    </div>

    <!-- Hộp thoại Popup -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <!-- Icon trang trí nhỏ -->
            <div class="decor top-right">🎀</div>
            <div class="decor bottom-left">🐈</div>
            <div class="decor bottom-right">🐈</div>

            <!-- Bên trái: Hình ảnh (Ở đây dùng Emoji làm ví dụ) -->
            <div class="modal-left">
                🎈<br>🎁
            </div>
            
            <!-- Bên phải: Nội dung chữ -->
            <div class="modal-right">
                <h2>Gửi em!</h2>
                <p>1 tuần có 7 ngày.<br>1 ngày có 24 giờ.<br>1 giờ có 60 phút.<br>1 phút có 60 giây.<br>Không có một ngày hoặc giờ nào mà anh không nghĩ về em.</p>
            </div>
        </div>
    </div>

    <!-- JavaScript xử lý sự kiện click -->
    <script>
        const openBtn = document.getElementById('openBtn');
        const modalOverlay = document.getElementById('modalOverlay');

        // Mở popup khi click vào nút
        openBtn.addEventListener('click', () => {
            modalOverlay.classList.add('active');
        });

        // Đóng popup khi click ra vùng tối bên ngoài hộp thoại
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                modalOverlay.classList.remove('active');
            }
        });
    </script>

</body>
</html>
